<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation - Carte</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }

    #controls { padding: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000; }
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }

    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; color: white;}
    .btn-route { background: #007bff; }
    .btn-incident { background: #dc3545; }
    #map { flex: 1; width: 100%; z-index: 1; }
  </style>
</head>
<body>

<div id="controls">
  <div class="input-group">
    <input type="text" id="startPoint" placeholder="Point de départ (ex: Sainte-Croix)">
    <input type="text" id="endPoint" placeholder="Destination (ex: Yverdon)">
  </div>
  <div class="btn-group">
    <button class="btn-route" onclick="calculateRoute()">Y aller</button>
    <button class="btn-incident" onclick="reportIncident()">⚠️ Signaler</button>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([46.8, 6.5], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  map.locate({setView: true, maxZoom: 15});

  map.on('locationfound', function(e) {
    L.marker(e.latlng).addTo(map)
            .bindPopup("Vous êtes ici !").openPopup();
  });

  map.on('locationerror', function(e) {
    console.warn("Géolocalisation refusée ou impossible : " + e.message);
  });

  function calculateRoute() {
    const start = document.getElementById('startPoint').value;
    const end = document.getElementById('endPoint').value;
    alert(`Le calcul d'itinéraire de "${start}" vers "${end}" sera implémenté ici avec une API de routage.`);
  }

  function reportIncident() {
    alert("L'interface pour signaler un incident (et l'envoi via WebSockets) s'ouvrira ici.");
  }
</script>
</body>
</html>
