<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckyRoad - Connexion</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; margin-top: 10px; }
        .hidden { display: none; }
        input { display: block; width: 90%; margin-bottom: 10px; padding: 8px; }
        button { width: 100%; padding: 10px; cursor: pointer; margin-bottom: 10px; }
        .lang-container { width: 300px; text-align: right; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="lang-container">
    <select class="lang-selector" onchange="setLanguage(this.value)" style="padding: 5px; border-radius: 5px;">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
    </select>
</div>

<div class="container" id="auth-container">
    <div id="login-section">
        <h2 data-i18n="login_title">Se connecter</h2>
        <form id="login-form">
            <input type="text" id="login-username" data-i18n-placeholder="username_placeholder" placeholder="Nom d'utilisateur" required>
            <input type="password" id="login-password" data-i18n-placeholder="password_placeholder" placeholder="Mot de passe" required>
            <button type="submit" data-i18n="login_btn">Connexion</button>
        </form>
        <p><span data-i18n="no_account">Pas de compte ?</span> <a href="#" onclick="toggleSection('signup')" data-i18n="signup_btn">S'inscrire</a></p>
    </div>

    <div id="signup-section" class="hidden">
        <h2 data-i18n="signup_title">Créer un compte</h2>
        <form id="signup-form">
            <input type="text" id="signup-username" data-i18n-placeholder="username_placeholder" placeholder="Nom d'utilisateur" required>
            <input type="password" id="signup-password" data-i18n-placeholder="password_placeholder" placeholder="Mot de passe" required>
            <button type="submit" data-i18n="signup_btn">S'inscrire</button>
        </form>
        <p><span data-i18n="has_account">Déjà un compte ?</span> <a href="#" onclick="toggleSection('login')" data-i18n="login_btn">Se connecter</a></p>
    </div>

    <p id="message" style="color: red;"></p>
</div>

<script src="js/translations.js"></script>
<script>
    if (localStorage.getItem('token')) {
        window.location.replace('home.html');
    }

    function toggleSection(section) {
        document.getElementById('login-section').classList.toggle('hidden', section === 'signup');
        document.getElementById('signup-section').classList.toggle('hidden', section === 'login');
        document.getElementById('message').innerText = '';
    }

    async function handleAuth(event, endpoint) {
        event.preventDefault();

        const formPrefix = endpoint === 'login' ? 'login' : 'signup';
        const username = document.getElementById(`${formPrefix}-username`).value;
        const password = document.getElementById(`${formPrefix}-password`).value;

        try {
            const API_URL = "https://pretpi-navigation.onrender.com";

            const response = await fetch(`${API_URL}/api/${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('message').style.color = 'green';

                if (endpoint === 'login') {
                    localStorage.setItem('token', data.token);

                    // Récupération de la langue depuis la BDD
                    if (data.language) {
                        setLanguage(data.language);
                    }

                    document.getElementById('message').innerText = 'Succès ! Redirection...';
                    window.location.href = 'home.html';
                } else if (endpoint === 'signup') {
                    // 1. On affiche le message de succès pendant qu'on est encore sur l'inscription
                    document.getElementById('message').style.color = 'green';
                    document.getElementById('message').innerText = 'Compte créé avec succès ! Redirection vers la connexion...';

                    // 2. On attend 2 secondes (2000 millisecondes) avant de basculer
                    setTimeout(() => {
                        toggleSection('login');
                        // On remet le message en vert car toggleSection l'efface
                        document.getElementById('message').style.color = 'green';
                        document.getElementById('message').innerText = 'Vous pouvez maintenant vous connecter.';
                    }, 2000);
                }

            } else {
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').innerText = data.error || 'Une erreur est survenue';
            }
        } catch (error) {
            document.getElementById('message').style.color = 'red';
            document.getElementById('message').innerText = "Erreur de connexion au serveur.";
            console.error(error);
        }
    }

    document.getElementById('login-form').addEventListener('submit', (e) => handleAuth(e, 'login'));
    document.getElementById('signup-form').addEventListener('submit', (e) => handleAuth(e, 'signup'));
</script>

</body>
</html>
